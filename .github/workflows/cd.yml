name: CD

# Action versions are pinned to release tags (no @latest).

on:
  push:
    branches: [main]

# Never cancel an in-flight production deploy.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: my-portfolio
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build-push:
    name: Build & push image (Docker Hub)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}

  deploy:
    name: Deploy to Vercel (production)
    needs: build-push
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global vercel@39
      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

  notify:
    name: Notify (commit status + summary)
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Set commit deployment status
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              target_url: process.env.DEPLOY_URL,
              context: "deploy/production",
              description: "Deployed to Vercel production",
            });
      - name: Write job summary
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
        run: |
          {
            echo "### ✅ Production deployment"
            echo ""
            echo "- **URL:** $DEPLOY_URL"
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
