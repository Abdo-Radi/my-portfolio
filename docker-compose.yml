# Local production-parity run:
#   docker compose up --build
#
# NEXT_PUBLIC_SITE_URL is a NEXT_PUBLIC_* value, so it is inlined at BUILD time
# and must be passed as a build arg (setting it only at runtime has no effect).
# Override it from your shell or a .env file:
#   NEXT_PUBLIC_SITE_URL=https://yourdomain.com docker compose up --build
#
# Runtime-only secrets (RESEND_API_KEY, CONTACT_FROM_EMAIL) are loaded from an
# optional .env file at run time. Empty values are treated as "not set"
# (see src/lib/env.ts), so copying .env.example verbatim is safe.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: my-portfolio:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
