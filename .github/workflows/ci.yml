name: CI

# Action versions are pinned to release tags (no @latest). For stricter supply
# chain guarantees you can repin these to full commit SHAs.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality (type-check, lint, format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check

  test:
    name: Test (vitest + coverage)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  security:
    name: Security (npm audit + Lighthouse CI)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: npm audit (production dependencies)
        # Report-only: transitive advisories shouldn't block the pipeline.
        # Flip to blocking by removing continue-on-error.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Build (for Lighthouse)
        run: npm run build
      - name: Lighthouse CI
        # Assertions are warn-level (see lighthouserc.json); report is uploaded
        # to temporary public storage. Does not block the pipeline.
        continue-on-error: true
        run: npx --yes @lhci/cli@0.14.2 autorun

  docker:
    name: Docker (build + /api/health)
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: my-portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - name: Run container and check /api/health
        run: |
          docker run -d --name ci-test -p 3000:3000 my-portfolio:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "Container healthy after $((i * 2))s"
              break
            fi
            sleep 2
          done
          body=$(curl -fsS http://localhost:3000/api/health)
          echo "Health response: $body"
          echo "$body" | grep -q '"status":"ok"'
      - name: Container logs on failure
        if: failure()
        run: docker logs ci-test || true
      - name: Cleanup
        if: always()
        run: docker rm -f ci-test || true
